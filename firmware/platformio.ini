[platformio]
default_envs = vibe_pet

; 共享配置（与 ../wio 工程一致）
[env]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino
upload_port = COM8
monitor_speed = 115200

; 小苹果桌面宠物固件
[env:vibe_pet]
; 音效管理器：宠物页状态音，使用 WIO_BUZZER 代码合成
build_src_filter = -<*> +<vibe_pet.cpp> +<clock.cpp> +<time_snap.cpp> +<sun.cpp> +<save.cpp> +<screens.cpp> +<archive.cpp> +<orchard.cpp> +<orchard_store.cpp> +<fridge_store.cpp> +<ui_canvas.cpp> +<ui_hints.cpp> +<audio_manager.cpp>
lib_deps =
	seeed-studio/Seeed Arduino FS@^2.1.5
	seeed-studio/Seeed Arduino SFUD@^2.0.2
